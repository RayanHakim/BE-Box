<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Box Challenge</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="home-wrap">

        <nav class="topbar">
            <div class="brand">
                <span class="brand-mark">?</span>
                MYSTERY<span>BOX</span>
            </div>

            <a class="admin-link" href="admin.html">
                Admin Panel ↗
            </a>
        </nav>

        <section class="hero">

            <div class="eyebrow">
                THE ULTIMATE GROUP QUIZ
            </div>

            <h1>
                Choose your box.<br>
                <span>Test your luck.</span>
            </h1>

            <p>
                Ambil mystery box, jawab pertanyaan,
                kumpulkan poin, dan jadilah juara!
            </p>

            <div class="hero-actions">

                <a class="btn btn-primary" href="game.html">
                    Mulai Permainan <span>→</span>

                </a>

            <div class="mini-stats">

                <div>
                    <b>01</b>
                    <small>Pilih box</small>
                </div>

                <div>
                    <b>02</b>
                    <small>Jawab tantangan</small>
                </div>

                <div>
                    <b>03</b>
                    <small>Raih poin</small>
                </div>

            </div>

        </section>

        <footer>
            LOCAL GAME · PLAY TOGETHER · HAVE FUN
        </footer>

    <script src="js/storage.js"></script>
