<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Box Challenge</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body class="home-page">

    <div class="home-wrap">

        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">?</span>
                MYSTERY<span>BOX</span>
            </div>

            <div class="site-nav-actions">
                <button type="button" class="site-icon-control site-sound-toggle" id="gameMusicToggle"
                    aria-label="Suara situs" aria-pressed="true" title="Matikan suara">
                    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 17V6l11-2v11M9 9l11-2"/>
                        <ellipse cx="6.5" cy="17" rx="2.5" ry="2" fill="currentColor" stroke="none"/>
                        <ellipse cx="17.5" cy="15" rx="2.5" ry="2" fill="currentColor" stroke="none"/>
                        <path class="sound-off-slash" d="m3 3 18 18"/>
                    </svg>
                </button>
                <a class="admin-link" href="admin.html">
                    Panel Admin <span aria-hidden="true">↗</span>
                </a>
            </div>
        </header>

        <main class="home-main">
            <section class="home-hero" aria-labelledby="home-title">
                <div class="home-intro">
                    <h1 id="home-title">Pilih kotak.<br>Uji keberuntungan.</h1>

                    <p>Pilih mystery box bersama teman, jawab pertanyaan, dan kumpulkan poin untuk jadi juara.</p>

                    <div class="home-actions">
                        <a class="btn btn-primary" href="game.html">
                            <span id="startGameLabel">Mulai Permainan</span> <span aria-hidden="true">→</span>
                        </a>
                        <a class="btn btn-ghost" href="game.html?view=history">Riwayat Permainan</a>
                    </div>
                </div>

                <div class="home-art" aria-hidden="true">
                    <div class="home-box">
                        <div class="home-box-side"></div>
                        <div class="home-box-front">?</div>
                        <div class="home-box-top"></div>
                    </div>
                </div>
            </section>

            <dl class="mini-stats" aria-label="Pengaturan permainan">
                <div>
                    <dt>Pertanyaan aktif</dt>
                    <dd id="activeQuestionCount">—</dd>
                </div>
                <div>
                    <dt>Giliran minimum per pemain</dt>
                    <dd id="minimumTurns">—</dd>
                </div>
                <div>
                    <dt>Detik per soal</dt>
                    <dd id="secondsPerQuestion">—</dd>
                </div>
            </dl>
        </main>

    </div>

    <audio id="gameMusic" src="assets/menu-background.wav" preload="none" loop></audio>
    <script src="js/storage.js"></script>
    <script src="js/game-effects.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
